<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dbt Fusion issue health · DuckDB WASM</title>
  <style>
    :root {
      --bg: #f7f7f5; --card: #ffffff; --border: #e3e2de; --text: #1f1f1d; --muted: #6b6a66;
      --link: #1d5fb0; --warn-bg: #fff4e5; --warn: #8a4b00; --grid: #e3e2de;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e1e2e; --card: #262637; --border: #313244; --text: #cdd6f4; --muted: #a6adc8;
              --link: #89b4fa; --warn-bg: #3b2a1e; --warn: #fab387; --grid: #313244; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           margin: 0 auto; padding: 20px 16px 40px; max-width: 1040px; }
    h1 { font-size: 1.25rem; font-weight: 650; margin: 0 0 2px; }
    .sub, .asof, #status { color: var(--muted); font-size: 0.82rem; margin: 2px 0; }
    .stale { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: 6px;
             padding: 8px 12px; font-weight: 600; font-size: 0.85rem; margin: 8px 0; }
    .error { color: var(--warn) !important; }
    h2.question { font-size: 1rem; font-weight: 650; margin: 28px 0 10px; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kpi, .tile { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .kpi-label { color: var(--muted); font-size: 0.75rem; }
    .kpi-value { font-size: 1.8rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .kpi-context { color: var(--muted); font-size: 0.72rem; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .tiles.one { grid-template-columns: 1fr; }
    .tile h3 { font-size: 0.9rem; margin: 0; }
    .tile .tile-sub { color: var(--muted); font-size: 0.75rem; margin: 2px 0 10px; }
    .tile svg { max-width: 100%; height: auto; }
    .table-wrap { max-height: 460px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { position: sticky; top: 0; background: var(--card); color: var(--muted); text-align: left; font-weight: 600;
         padding: 6px 8px; border-bottom: 1px solid var(--border); }
    td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td a { color: var(--link); text-decoration: none; }
    td a:hover { text-decoration: underline; }
    .bar { display: flex; align-items: center; gap: 6px; min-width: 150px; }
    .bar .track { flex: 1; height: 0.7rem; background: var(--grid); border-radius: 3px; overflow: hidden; }
    .bar .track > div { height: 100%; }
    .bar > span { font-size: 0.75rem; min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
    @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } .tiles { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header id="header"><h1>dbt Fusion issue health · DuckDB WASM + MotherDuck</h1></header>
  <p id="status">Connecting…</p>
  <div id="root"></div>

  <script type="module">
    // Tiles come from dashboard/tiles.yml; data is queried live from the dbt
    // dashboard models in MotherDuck as `SELECT * FROM <model> ORDER BY <order_by>`.
    // The page only selects, renames, formats and lightly pivots model columns.
    import {MDConnection} from 'https://esm.sh/@motherduck/wasm-client@0.8.1';
    import * as Plot from 'https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/+esm';
    import yaml from 'https://esm.sh/js-yaml@4.1.0';

    const TOKEN = '__MOTHERDUCK_READ_TOKEN__';
    const status = document.getElementById('status');
    const root = document.getElementById('root');
    const header = document.getElementById('header');

    // Every dbt dashboard model this page reads; dashboard_meta feeds the header.
    const MODELS = [
      'dashboard_meta', 'headline_kpis', 'backlog_weekly', 'weekly_flow', 'triage_pipeline',
      'response_weekly', 'triage_queue', 'open_by_area', 'open_by_adapter', 'epic_progress',
      'top_requested', 'assignee_workload',
    ];

    if (!TOKEN || TOKEN.startsWith('__')) {
      status.textContent = 'Token not injected — run the deploy workflow to embed MOTHERDUCK_READ_TOKEN.';
      status.className = 'error';
    } else {
      main().catch(err => { status.textContent = `Error: ${err.message}`; status.className = 'error'; console.error(err); });
    }

    const TTL = 60 * 60 * 1000;
    async function q(conn, sql) {
      const key = `md:${sql}`;
      try {
        const hit = sessionStorage.getItem(key);
        if (hit) { const {rows, ts} = JSON.parse(hit); if (Date.now() - ts < TTL) return rows; }
      } catch {}
      const result = await conn.evaluateQuery(sql);
      const rows = JSON.parse(JSON.stringify(result.data.toRows(), (_, v) => typeof v === 'bigint' ? Number(v) : v));
      try { sessionStorage.setItem(key, JSON.stringify({rows, ts: Date.now()})); } catch {}
      return rows;
    }

    // ── Formatting helpers ────────────────────────────────────────────────────
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const num = v => v == null ? '—' : Number(v).toLocaleString('en-US', {maximumFractionDigits: 1});
    const isoDay = v => v instanceof Date || typeof v === 'number' ? new Date(v).toISOString().slice(0, 10) : String(v).slice(0, 10);
    const toDate = v => new Date(`${isoDay(v)}T00:00:00Z`);
    function fill(template, row) {  // bare column or "{col}" / "{col:+}" template; nulls -> "—"
      const t = String(template), tpl = t.includes('{') ? t : `{${t}}`;
      if ([...tpl.matchAll(/\{(\w+)(?::\+)?\}/g)].some(([, c]) => row[c] == null)) return '—';
      return tpl.replace(/\{(\w+)(:\+)?\}/g, (_, c, sign) => (sign && row[c] > 0 ? '+' : '') + num(row[c]));
    }
    const COLUMN_LABELS = {
      issue_number: '#', epic_number: '#', title: 'Title', issue_category: 'Type', areas: 'Areas',
      triage_status: 'Triage', reactions: 'Reactions', comments: 'Comments', age_days: 'Age (d)',
      days_idle: 'Idle (d)', is_customer_reported: 'Customer', child_closed: 'Closed',
      child_total: 'Sub-issues', pct_complete: '% complete', milestone_title: 'Milestone',
    };
    const NUMERIC = new Set(['reactions', 'comments', 'age_days', 'days_idle', 'child_closed', 'child_total', 'pct_complete']);

    function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

    async function main() {
      const [contract, conn] = await Promise.all([
        fetch('../tiles.yml').then(r => { if (!r.ok) throw new Error(`tiles.yml: ${r.status}`); return r.text(); }).then(yaml.load),
        (async () => { const c = MDConnection.create({mdToken: TOKEN}); await c.isInitialized(); return c; })(),
      ]);
      status.textContent = 'Loading data…';

      const tiles = new Map(contract.sections.flatMap(s => s.tiles.map(t => [t.id, t])));
      const orderBy = Object.fromEntries([...tiles.values()].map(t => [t.model, t.order_by]));
      const rowsList = await Promise.all(MODELS.map(m =>
        q(conn, `SELECT * FROM fusion_issues.main.${m}` + (orderBy[m] ? ` ORDER BY ${orderBy[m]}` : ''))));
      const data = Object.fromEntries(MODELS.map((m, i) => [m, rowsList[i]]));

      // ── Palette (dark values when the page is dark) ─────────────────────────
      const mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const css = getComputedStyle(document.documentElement);
      const TEXT = css.getPropertyValue('--text').trim();
      const keys = k => Object.keys(contract.palette[k]);
      const color = (k, n) => { const e = contract.palette[k][n]; return typeof e === 'string' ? e : e[mode]; };
      const label = (k, n) => contract.palette[k]?.[n]?.label ?? n;
      const scale = k => ({domain: keys(k), range: keys(k).map(n => color(k, n)), legend: true, tickFormat: n => label(k, n)});
      const SINGLE = contract.palette.single_series;
      const style = {background: 'transparent', color: TEXT, fontSize: '11px'};
      const tipChannels = t => Object.fromEntries((t.tooltip ?? []).map(c => [c, c]));

      // ── Chart forms (tiles.yml `form`) ──────────────────────────────────────
      const W = 480;
      const FORMS = {
        stacked_area: (t, rows) => Plot.plot({
          style, width: W, height: 260,
          x: {type: 'utc', label: null}, y: {label: 'Open issues', grid: true},
          color: scale(t.color),
          marks: [Plot.areaY(rows, {x: d => toDate(d[t.x]), y: t.y, fill: t.color, order: keys(t.color), tip: true}), Plot.ruleY([0])],
        }),
        grouped_bar: (t, rows) => Plot.plot({  // light pivot: series columns -> long rows
          style, width: W, height: 260,
          fx: {label: null, interval: 'week', tickFormat: '%b %d', ticks: 5},
          x: {axis: null, domain: t.series}, y: {label: 'Issues', grid: true},
          color: scale('flow'),
          marks: [
            Plot.barY(rows.flatMap(d => t.series.map(s => ({week: toDate(d[t.x]), series: s, issues: d[s],
              ...Object.fromEntries((t.tooltip ?? []).map(c => [c, d[c]]))}))),
              {fx: 'week', x: 'series', y: 'issues', fill: 'series', tip: {channels: tipChannels(t)}}),
            Plot.ruleY([0]),
          ],
        }),
        horizontal_stacked_bar: (t, rows) => {
          const domain = [...new Set(rows.map(d => d[t.y]))];  // rows arrive in order_by order
          return Plot.plot({
            style, width: W, height: Math.max(150, 26 * domain.length + 60), marginLeft: 140,
            x: {label: 'Open issues', grid: true}, y: {label: null, domain},
            color: scale(t.color),
            marks: [Plot.barX(rows, {y: t.y, x: t.x, fill: t.color, order: keys(t.color), tip: true}), Plot.ruleX([0])],
          });
        },
        line: (t, rows) => Plot.plot({
          style, width: W, height: 260,
          x: {type: 'utc', label: null}, y: {label: '% answered within 48h', domain: [0, 100], grid: true},
          marks: [
            Plot.lineY(rows, {x: d => toDate(d[t.x]), y: t.y, stroke: SINGLE, strokeWidth: 2}),
            Plot.dot(rows, {x: d => toDate(d[t.x]), y: t.y, fill: SINGLE, r: 2.5}),
            Plot.tip(rows, Plot.pointerX({x: d => toDate(d[t.x]), y: t.y, channels: tipChannels(t)})),
          ],
        }),
        table: (t, rows) => {
          const cell = (c, d) => {
            const v = d[c];
            if (c === 'issue_number' || c === 'epic_number') return `<a href="${esc(d[t.link])}" target="_blank" rel="noopener">#${esc(v)}</a>`;
            if (c === 'title') return `<a href="${esc(d[t.link])}" target="_blank" rel="noopener">${esc(v)}</a>`;
            if (c === 'issue_category') return esc(label('issue_category', v));
            if (typeof v === 'boolean') return v ? 'Yes' : '';
            if (c === 'pct_complete' && t.form === 'table_with_bar')
              return `<div class="bar"><div class="track"><div style="width:${Number(v) || 0}%;background:${SINGLE}"></div></div><span>${num(v)}%</span></div>`;
            return NUMERIC.has(c) ? num(v) : esc(v);
          };
          const cls = c => NUMERIC.has(c) ? ' class="num"' : '';
          return el('div', 'table-wrap', `<table>
            <thead><tr>${t.columns.map(c => `<th${cls(c)}>${COLUMN_LABELS[c] ?? c}</th>`).join('')}</tr></thead>
            <tbody>${rows.map(d => `<tr>${t.columns.map(c => `<td${cls(c)}>${cell(c, d)}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>`);
        },
      };
      FORMS.table_with_bar = FORMS.table;

      function tileCard(t) {
        const card = el('div', 'tile', `<h3>${esc(t.title)}</h3><p class="tile-sub">${esc(t.subtitle)}</p>`);
        card.append(FORMS[t.form](t, data[t.model]));
        return card;
      }

      // ── Header: freshness banner ────────────────────────────────────────────
      const meta = data.dashboard_meta[0] ?? {};
      header.innerHTML = `<h1>${esc(contract.title)}</h1><p class="sub">${esc(contract.subtitle)} · DuckDB WASM + MotherDuck</p>
        <p class="asof">Data as of <strong>${isoDay(meta.as_of_date)}</strong> · ${esc(meta.source_repo)} · label ${esc(meta.source_label)}</p>`;
      if (meta.days_stale > contract.meta.stale_after_days)
        header.append(el('p', 'stale', `⚠ Data is ${meta.days_stale} days old — the extract has probably stopped.`));

      // ── Sections in contract order ──────────────────────────────────────────
      for (const section of contract.sections) {
        root.append(el('h2', 'question', esc(section.question)));
        const charts = [];
        const flush = () => { if (charts.length) { const g = el('div', charts.length > 1 ? 'tiles' : 'tiles one'); g.append(...charts.splice(0)); root.append(g); } };
        for (const t of section.tiles) {
          if (t.form === 'kpi_row') {
            const row = data[t.model][0] ?? {};
            root.append(el('div', 'kpis', t.kpis.map(k => `<div class="kpi">
              <div class="kpi-label">${esc(k.label)}</div>
              <div class="kpi-value">${esc(fill(k.value, row))}</div>
              ${k.context ? `<div class="kpi-context">${esc(fill(k.context, row))}</div>` : ''}</div>`).join('')));
          } else if (t.form.startsWith('table')) {
            flush(); charts.push(tileCard(t)); flush();   // tables span the full width
          } else {
            charts.push(tileCard(t)); if (charts.length === 2) flush();
          }
        }
        flush();
      }

      status.textContent = 'Data loaded live from MotherDuck (DuckDB WASM).';
    }
  </script>
</body>
</html>
