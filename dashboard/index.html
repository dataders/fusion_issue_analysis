<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Service worker adds COOP + COEP (credentialless) so DuckDB-WASM works on GitHub Pages -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw-coep.js").then((reg) => {
        if (!crossOriginIsolated) {
          if (reg.installing) {
            reg.installing.addEventListener("statechange", (e) => {
              if (e.target.state === "activated") location.reload();
            });
          } else {
            location.reload();
          }
        }
      });
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dbt v2 Issue Analysis — Framework Bakeoff</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { color-scheme: dark; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #111;
    }

    header {
      flex-shrink: 0;
      padding: 10px 20px 0;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .chrome-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      min-width: 0;
    }

    .header-title {
      font-size: 0.78rem;
      font-weight: 400;
      color: #aaa;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chrome-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      color: #aaa;
      font-size: 0.76rem;
      white-space: nowrap;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border: 1px solid #2d2d2d;
      border-radius: 4px;
      background: #1a1a1a;
      opacity: 0.76;
      transition: opacity 0.1s, border-color 0.1s;
    }

    .repo-link:hover,
    .repo-link:focus-visible {
      border-color: #666;
      opacity: 1;
    }

    .repo-link img {
      width: 16px;
      height: 16px;
    }

    button, select, input { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid #98baff; outline-offset: 3px;
    }
    [hidden] { display: none !important; }
    .toolbar { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; flex-wrap: wrap; }
    .toolbar button, .pane-header button, .pane-header select, .toolbar select {
      padding: 8px 12px; border: 1px solid #444; border-radius: 7px;
      background: #252525; color: #eee; font-size: .82rem;
    }
    .toolbar button:hover, .pane-header button:hover { background: #353535; }
    #picker-toggle { min-width: 210px; display: flex; justify-content: space-between; gap: 24px; text-align: left; }
    .picker { position: relative; }
    .picker-panel {
      position: absolute; top: calc(100% + 8px); left: 0; z-index: 10;
      width: min(370px, calc(100vw - 24px)); padding: 12px;
      border: 1px solid #444; border-radius: 12px; background: #1c1c1c;
      box-shadow: 0 16px 48px #0008; color: #eee;
    }
    #framework-search { width: 100%; padding: 10px 12px; background: #111; border: 1px solid #555; border-radius: 7px; color: #fff; }
    .main-tabs { display: flex; flex-direction: column; max-height: min(60vh, 480px); overflow-y: auto; margin-top: 10px; gap: 2px; }
    .main-tabs button { text-align: left; padding: 9px 12px; background: transparent; border: 0; border-radius: 5px; color: #bbb; white-space: nowrap; }
    .main-tabs button:hover { background: #333; color: #fff; }
    .main-tabs button.active { background: #fff; color: #111; font-weight: 600; }
    .tab-divider { padding: 12px 12px 5px; color: #999; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; }
    #no-frameworks { padding: 18px 12px; font-size: .85rem; color: #aaa; }
    .toolbar .primary-action { background: #e8ecff; color: #182243; border-color: #e8ecff; }
    .toolbar .primary-action:hover { background: #fff; }
    .toolbar a { color: #aaa; font-size: .82rem; text-decoration: none; margin-left: auto; }
    .toolbar a:hover { color: #fff; }
    .compare-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .compare-tools label { font-size: .8rem; color: #bbb; display: flex; align-items: center; gap: 6px; }
    #share-status { font-size: .76rem; color: #b6c9ff; }
    #share-url { width: 240px; max-width: 100%; }
    #panes { display: flex; flex: 1; min-height: 0; min-width: 0; gap: 1px; background: #555; }
    .pane { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: #fff; }
    .pane-header { display: flex; align-items: center; gap: 8px; background: #202020; color: #ddd; padding: 8px 12px; min-height: 52px; }
    .pane-header strong { font-size: .82rem; min-width: 0; flex: 1; }
    .pane-header select { min-width: 0; width: 100%; flex: 1; }
    .pane-header button { padding: 6px 9px; }
    #panes.stacked { flex-direction: column; }
    .subnav button { padding: 7px 18px; color: #aaa; font-size: .875rem; }

    .version-badge {
      display: inline-block;
      margin-left: 7px;
      padding: 1px 5px;
      border: 1px solid currentColor;
      border-radius: 9px;
      font-size: 0.65rem;
      font-weight: 500;
      opacity: 0.8;
      vertical-align: 1px;
    }

    .version-badge.current { color: #5cc996; }
    .version-badge.outdated { color: #ffb454; }
    .version-badge.unverified, .version-badge.untracked, .version-badge.snapshot { color: #888; }
    nav button.active .version-badge.current { color: #146b45; }
    nav button.active .version-badge.outdated { color: #8b4b00; }
    nav button.active .version-badge.unverified,
    nav button.active .version-badge.untracked,
    nav button.active .version-badge.snapshot { color: #555; }

    .subnav {
      display: flex;
      gap: 6px;
      padding: 9px 0 10px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .subnav[hidden] {
      display: none;
    }

    .subnav button {
      padding: 5px 12px;
      border-color: #333;
      border-radius: 4px;
      background: #1b1b1b;
      font-size: 0.8rem;
    }

    .subnav button:hover {
      color: #ddd;
      border-color: #555;
    }

    .subnav button.active {
      background: #e8e8e8;
      color: #111;
      border-color: #555;
      font-weight: 600;
    }

    iframe {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
      background: #fff;
    }

    @media (max-width: 720px) {
      #panes { flex-direction: column; }
      #layout-control { display: none; }
      .compare-tools { width: 100%; }
      .pane-header { padding: 6px 10px; }

      header {
        padding-right: 12px;
        padding-left: 12px;
      }

      .chrome-bar {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .header-title {
        white-space: normal;
      }

      .chrome-meta {
        font-size: 0.72rem;
        flex-wrap: wrap;
        white-space: normal;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <script>
    const tabs = Array.from(document.querySelectorAll('.main-tabs button'));
    const prefabThemes = Array.from(document.querySelectorAll('#prefab-themes button'));
    const prefabThemeBar = document.getElementById('prefab-themes');
    const duckdbWasmViews = Array.from(document.querySelectorAll('#duckdb-wasm-views button'));
    const duckdbWasmBar = document.getElementById('duckdb-wasm-views');
    const frame = document.getElementById('frame');
    const dataRefreshed = document.getElementById('data-refreshed');
    const versionsChecked = document.getElementById('versions-checked');
    const legacyPrefabThemeAliases = {
      "prefab-reactive": "reactive",
      "prefab-myspace": "myspace",
      "prefab-windows-2000": "windows-2000",
    };
    const legacyTabAliases = {
      "dataface": "dbt-charts",
    };

    function frameworkLabel(button) {
      return button.dataset.label || button.firstChild.textContent.trim();
    }

    function formatTimestamp(value) {
      if (!value) return null;
      const timestamp = new Date(value);
      if (Number.isNaN(timestamp.getTime())) return null;
      return timestamp.toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short",
      });
    }

    async function loadDataFreshness() {
      try {
        const response = await fetch("data_freshness.json", { cache: "no-store" });
        if (!response.ok) throw new Error("missing data freshness metadata");
        const metadata = await response.json();
        const latestLoad = formatTimestamp(metadata.latest_load_at);
        if (!latestLoad) throw new Error("invalid data freshness timestamp");

        dataRefreshed.textContent = `Data refreshed: ${latestLoad}`;

        const details = [];
        if (metadata.source) details.push(`Source: ${metadata.source}`);
        if (metadata.issue_rows) details.push(`Issues loaded: ${metadata.issue_rows}`);
        const latestSourceUpdate = formatTimestamp(metadata.latest_source_updated_at);
        if (latestSourceUpdate) details.push(`Latest GitHub update in data: ${latestSourceUpdate}`);
        dataRefreshed.title = details.join("\n");
      } catch {
        dataRefreshed.textContent = "Data refreshed: unavailable";
        dataRefreshed.title = "Run `make data-freshness` to generate dashboard/data_freshness.json.";
      }
    }

    async function loadFrameworkVersions() {
      try {
        const response = await fetch('framework_versions.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('missing framework versions');
        const metadata = await response.json();
        const checked = formatTimestamp(metadata.checked_at);
        versionsChecked.textContent = checked ? `Versions checked: ${checked}` : 'Versions: check unavailable';
        for (const button of tabs) {
          const entry = metadata.frameworks?.[button.dataset.tab];
          if (!entry) continue;
          const label = frameworkLabel(button);
          button.dataset.label = label;
          const version = entry.installed ? `v${entry.installed.length > 16 ? entry.installed.slice(0, 7) : entry.installed}` : 'untracked';
          const badge = document.createElement('span');
          badge.className = `version-badge ${entry.status}`;
          badge.textContent = `${version} ${entry.status === 'current' ? '✓' : entry.status === 'outdated' ? '↑' : '?'}`;
          badge.setAttribute('aria-hidden', 'true');
          button.append(badge);
          const status = entry.status === 'current' ? 'Current' : entry.status === 'outdated' ? 'Update available' : entry.status === 'untracked' ? 'Version not recorded' : entry.status === 'snapshot' ? 'Static export version not verified' : 'Latest release could not be checked';
          const detail = `${label}: ${entry.installed ?? 'unknown'} · ${status}${entry.latest ? ` (latest: ${entry.latest})` : ''}${checked ? ` · checked ${checked}` : ''}`;
          button.title = detail;
          button.setAttribute('aria-description', detail);
        }
      } catch {
        versionsChecked.textContent = 'Versions: unavailable';
      }
    }

    function setActive(buttons, active) {
      buttons.forEach(button => button.classList.toggle('active', button === active));
    }

    function activePrefabTheme() {
      return prefabThemes.find(button => button.classList.contains('active')) || prefabThemes[0];
    }

    function activeDuckDBView() {
      return duckdbWasmViews.find(b => b.classList.contains('active')) || duckdbWasmViews[0];
    }

    function switchTab(btn, options = {}) {
      // Keep pane choices distinct when switching the primary framework.
      const previous = tabs.find(button => button.classList.contains('active'));
      comparisons = comparisons.map(id => id === btn.dataset.tab ? previous.dataset.tab : id);
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('selected-framework').textContent = frameworkLabel(btn);
      document.getElementById('primary-name').textContent = frameworkLabel(btn);
      closePicker();
      const isPrefab = btn.dataset.tab === "prefab";
      const isDuckDBWasm = btn.dataset.tab === "duckdb-wasm";
      prefabThemeBar.hidden = !isPrefab;
      duckdbWasmBar.hidden = !isDuckDBWasm;

      if (isPrefab) {
        const themeName = options.theme || activePrefabTheme().dataset.theme || "vanilla";
        const theme = prefabThemes.find(button => button.dataset.theme === themeName) || prefabThemes[0];
        setActive(prefabThemes, theme);
        frame.src = theme.dataset.src;
        frame.title = `Prefab ${theme.textContent.trim()}`;
        updateUrl("prefab", theme.dataset.theme);
      } else if (isDuckDBWasm) {
        const viewName = options.view || activeDuckDBView().dataset.view || "health";
        const view = duckdbWasmViews.find(b => b.dataset.view === viewName) || duckdbWasmViews[0];
        setActive(duckdbWasmViews, view);
        frame.src = view.dataset.src;
        frame.title = `DuckDB WASM · ${view.textContent.trim()}`;
        updateUrl("duckdb-wasm", null, viewName === "health" ? null : viewName);
      } else {
        frame.src = btn.dataset.src;
        frame.title = frameworkLabel(btn);
        updateUrl(btn.dataset.tab);
      }
      if (btn.dataset.tab === 'about') comparisons = [];
      renderComparisons();
      writeComparisonUrl();
    }

    function switchPrefabTheme(btn) {
      const prefabTab = tabs.find(button => button.dataset.tab === "prefab");
      switchTab(prefabTab, { theme: btn.dataset.theme });
    }

    function switchDuckDBView(btn) {
      const duckdbTab = tabs.find(button => button.dataset.tab === "duckdb-wasm");
      switchTab(duckdbTab, { view: btn.dataset.view });
    }

    function updateUrl(tab, theme, view) {
      const url = new URL(window.location);
      url.searchParams.set("tab", tab);
      if (theme && theme !== "vanilla") {
        url.searchParams.set("theme", theme);
      } else {
        url.searchParams.delete("theme");
      }
      if (view) {
        url.searchParams.set("view", view);
      } else {
        url.searchParams.delete("view");
      }
      url.hash = tab;
      if (window.location.search !== url.search || window.location.hash !== url.hash) {
        history.replaceState(null, "", url);
      }
    }

    function loadTabFromHash() {
      const params = new URLSearchParams(window.location.search);
      let tab = params.get("tab") || window.location.hash.replace(/^#/, "");
      let theme = params.get("theme");
      let view = params.get("view");
      comparisons = (params.get('compare') || '').split(',').filter((id, index, ids) =>
        tabs.some(button => button.dataset.tab === id && id !== 'about') && ids.indexOf(id) === index
      );
      document.getElementById('layout').value = params.get('layout') === 'stacked' ? 'stacked' : 'side';
      document.getElementById('link-scroll').checked = params.get('scroll') === 'linked';
      if (!tab) tab = 'dbt-charts';

      tab = legacyTabAliases[tab] || tab;

      if (legacyPrefabThemeAliases[tab]) {
        theme = legacyPrefabThemeAliases[tab];
        tab = "prefab";
      }
      if (tab === "prefab" && !theme) {
        theme = "vanilla";
      }

      const match = tabs.find(btn => btn.dataset.tab === tab) || tabs[0];
      comparisons = comparisons.filter(id => id !== match.dataset.tab).slice(0, 2);
      if (match) switchTab(match, { theme, view });
    }

    let comparisons = [];
    const picker = document.getElementById('framework-picker');
    const pickerToggle = document.getElementById('picker-toggle');
    const search = document.getElementById('framework-search');
    const panes = document.getElementById('panes');
    const compareToggle = document.getElementById('compare-toggle');
    const catalog = tabs.filter(button => button.dataset.tab !== 'about');

    function closePicker() {
      const hadFocus = picker.contains(document.activeElement);
      picker.hidden = true;
      pickerToggle.setAttribute('aria-expanded', 'false');
      if (hadFocus) pickerToggle.focus();
    }
    function filterFrameworks() {
      const query = search.value.trim().toLowerCase();
      tabs.forEach(button => { button.hidden = !button.textContent.toLowerCase().includes(query); });
      document.querySelectorAll('.tab-divider').forEach(heading => {
        let item = heading.nextElementSibling;
        let visible = false;
        while (item && !item.classList.contains('tab-divider')) {
          visible ||= !item.hidden;
          item = item.nextElementSibling;
        }
        heading.hidden = !visible;
      });
      document.getElementById('no-frameworks').hidden = tabs.some(button => !button.hidden);
    }
    pickerToggle.addEventListener('click', () => {
      if (!picker.hidden) return closePicker();
      picker.hidden = false;
      pickerToggle.setAttribute('aria-expanded', 'true');
      search.value = '';
      filterFrameworks();
      search.focus();
    });
    search.addEventListener('input', filterFrameworks);
    picker.addEventListener('keydown', event => {
      if (event.key === 'Escape') { event.preventDefault(); closePicker(); }
      const visible = tabs.filter(button => !button.hidden);
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const index = visible.indexOf(document.activeElement);
        const next = event.key === 'ArrowDown' ? index + 1 : (index < 0 ? visible.length - 1 : index - 1);
        visible[(next + visible.length) % visible.length]?.focus();
      }
      if (event.key === 'Enter' && event.target === search && visible.length) {
        event.preventDefault(); switchTab(visible[0]);
      }
    });
    document.addEventListener('click', event => {
      if (!event.target.closest('.picker')) closePicker();
    });
    document.addEventListener('focusin', event => {
      if (!event.target.closest('.picker')) closePicker();
    });

    function primaryId() { return tabs.find(button => button.classList.contains('active')).dataset.tab; }
    function writeComparisonUrl() {
      const url = new URL(location.href);
      ['compare', 'layout', 'scroll'].forEach(key => url.searchParams.delete(key));
      if (comparisons.length) {
        url.searchParams.set('compare', comparisons.join(','));
        if (document.getElementById('layout').value === 'stacked') url.searchParams.set('layout', 'stacked');
        if (document.getElementById('link-scroll').checked) url.searchParams.set('scroll', 'linked');
      }
      history.replaceState(null, '', url);
      document.getElementById('share-status').textContent = '';
      document.getElementById('share-url').hidden = true;
    }
    function addComparison() {
      if (primaryId() === 'about') switchTab(tabs[0]);
      const next = catalog.find(button => button.dataset.tab !== primaryId() && !comparisons.includes(button.dataset.tab));
      if (next && comparisons.length < 2) comparisons.push(next.dataset.tab);
      renderComparisons(); writeComparisonUrl();
    }
    function renderComparisons() {
      const comparing = comparisons.length > 0;
      compareToggle.textContent = comparing ? 'Exit comparison' : 'Compare frameworks';
      compareToggle.setAttribute('aria-pressed', String(comparing));
      document.getElementById('compare-tools').hidden = !comparing;
      document.getElementById('primary-heading').hidden = !comparing;
      document.getElementById('add-pane').hidden = comparisons.length >= 2;
      panes.classList.toggle('stacked', document.getElementById('layout').value === 'stacked');
      // Retain unchanged frames so selecting another pane never resets their filters.
      const existing = Array.from(panes.querySelectorAll('.comparison-pane'));
      comparisons.forEach((id, index) => {
        const button = catalog.find(item => item.dataset.tab === id);
        let pane = existing[index];
        if (!pane) {
          pane = document.createElement('section');
          pane.className = 'pane comparison-pane';
          pane.innerHTML = '<div class="pane-header"><select></select><button class="view-only">View only</button><button class="remove-pane">×</button></div><iframe></iframe>';
          panes.append(pane);
          pane.querySelector('iframe').addEventListener('load', event => attachScroll(event.target));
          pane.querySelector('select').addEventListener('change', event => {
            comparisons[index] = event.target.value;
            renderComparisons(); writeComparisonUrl();
          });
          pane.querySelector('.remove-pane').addEventListener('click', () => {
            comparisons.splice(index, 1); renderComparisons(); writeComparisonUrl();
            (comparisons.length ? panes.querySelector('.comparison-pane select') : compareToggle).focus();
          });
          pane.querySelector('.view-only').addEventListener('click', () => {
            const selected = comparisons[index]; comparisons = [];
            switchTab(catalog.find(item => item.dataset.tab === selected));
            pickerToggle.focus();
          });
        }
        pane.setAttribute('aria-label', `Comparison ${index + 2}`);
        const select = pane.querySelector('select');
        select.setAttribute('aria-label', `Framework ${index + 2}`);
        select.replaceChildren(...catalog.map(item => {
          const option = new Option(frameworkLabel(item), item.dataset.tab);
          option.disabled = item.dataset.tab === primaryId() || comparisons.some((value, i) => i !== index && value === item.dataset.tab);
          return option;
        }));
        select.value = id;
        pane.querySelector('.remove-pane').setAttribute('aria-label', `Remove comparison ${index + 2}`);
        const iframe = pane.querySelector('iframe');
        iframe.title = frameworkLabel(button);
        if (iframe.getAttribute('src') !== button.dataset.src) iframe.src = button.dataset.src;
      });
      existing.slice(comparisons.length).forEach(pane => pane.remove());
    }
    compareToggle.addEventListener('click', () => {
      if (!comparisons.length) return addComparison();
      comparisons = []; renderComparisons(); writeComparisonUrl();
    });
    document.getElementById('add-pane').addEventListener('click', addComparison);
    document.getElementById('focus-primary').addEventListener('click', () => {
      comparisons = []; renderComparisons(); writeComparisonUrl(); pickerToggle.focus();
    });
    document.getElementById('layout').addEventListener('change', () => { renderComparisons(); writeComparisonUrl(); });
    document.getElementById('link-scroll').addEventListener('change', writeComparisonUrl);
    document.getElementById('share-comparison').addEventListener('click', async () => {
      const status = document.getElementById('share-status');
      try {
        await navigator.clipboard.writeText(location.href);
        status.textContent = 'Link copied';
      } catch {
        const input = document.getElementById('share-url');
        input.hidden = false; input.value = location.href; input.focus(); input.select();
        status.textContent = 'Copy the selected link';
      }
    });

    // Same-origin page scrolling only. No chart filters or data are modified.
    const scrollTargets = new WeakMap();
    function attachScroll(iframe) {
      try {
        const doc = iframe.contentDocument;
        if (!doc) return;
        doc.addEventListener('scroll', () => {
          if (!document.getElementById('link-scroll').checked || !comparisons.length) return;
          const root = doc.scrollingElement;
          if (!root) return;
          const expected = scrollTargets.get(iframe);
          if (expected !== undefined && Math.abs(root.scrollTop - expected) < 2) return;
          scrollTargets.delete(iframe);
          const range = root.scrollHeight - root.clientHeight;
          if (range <= 0) return;
          const ratio = root.scrollTop / range;
          panes.querySelectorAll('iframe').forEach(other => {
            if (other === iframe) return;
            try {
              const target = other.contentDocument?.scrollingElement;
              if (!target) return;
              const top = Math.round(ratio * (target.scrollHeight - target.clientHeight));
              scrollTargets.set(other, top);
              target.scrollTop = top;
            } catch { /* External dashboards keep independent scrolling. */ }
          });
        }, { passive: true });
      } catch { /* External dashboards keep independent scrolling. */ }
    }
    frame.addEventListener('load', () => attachScroll(frame));
    attachScroll(frame);
    loadTabFromHash();
    loadDataFreshness();
    loadFrameworkVersions();
    window.addEventListener("popstate", loadTabFromHash);
    window.addEventListener("hashchange", loadTabFromHash);
  </script>
</body>
</html>
