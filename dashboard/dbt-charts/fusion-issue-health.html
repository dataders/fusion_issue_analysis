<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>dbt charts | dbt v2 issue health</title>
  <script>
    // dct renders one fixed theme, so scripts/render_dbt_charts.sh renders a
    // light and a dark variant; send the viewer to the one matching their system.
    const dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
    location.replace((dark ? "fusion-issue-health-dark.html" : "fusion-issue-health-light.html") + location.hash);
  </script>
</head>
<body>
  <p>
    <a href="fusion-issue-health-light.html">Light</a> ·
    <a href="fusion-issue-health-dark.html">Dark</a>
  </p>
</body>
</html>
