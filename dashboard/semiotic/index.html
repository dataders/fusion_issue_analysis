<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dbt Fusion issue health · Semiotic</title>
  <!-- One React copy for the page and for Semiotic (loaded with ?external=react,react-dom). -->
  <script type="importmap">
    {"imports": {
      "react": "https://esm.sh/react@19.1.0",
      "react/": "https://esm.sh/react@19.1.0/",
      "react-dom": "https://esm.sh/react-dom@19.1.0",
      "react-dom/": "https://esm.sh/react-dom@19.1.0/"
    }}
  </script>
  <style>
    :root {
      --bg: #f7f7f5; --card: #ffffff; --border: #e3e2de; --text: #1f1f1d; --muted: #6b6a66; --faint: #8d8c87;
      --link: #1d5fb0; --warn-bg: #fff4e5; --warn: #8a4b00; --track: #e3e2de;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e1e2e; --card: #262637; --border: #313244; --text: #cdd6f4; --muted: #a6adc8; --faint: #7f849c;
              --link: #89b4fa; --warn-bg: #3b2a1e; --warn: #fab387; --track: #313244; }
    }
    /* Semiotic reads its theme from CSS custom properties. */
    :root {
      --semiotic-bg: var(--card); --semiotic-surface: var(--card); --semiotic-text: var(--text);
      --semiotic-text-secondary: var(--muted); --semiotic-border: var(--border); --semiotic-grid: var(--border);
      --semiotic-tooltip-bg: var(--card); --semiotic-tooltip-text: var(--text);
      --semiotic-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           margin: 0 auto; padding: 20px 16px 40px; max-width: 1040px; }
    h1 { font-size: 1.2rem; font-weight: 650; margin: 0 0 4px; }
    .sub, .asof, .status { color: var(--muted); font-size: 0.8rem; margin: 2px 0; }
    .stale { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: 6px;
             padding: 8px 12px; font-weight: 600; font-size: 0.85rem; margin: 8px 0; }
    .error { color: var(--warn) !important; }
    h2.question { font-size: 1rem; font-weight: 650; margin: 28px 0 4px; }
    .hint { color: var(--faint); font-size: 0.73rem; margin: 0 0 10px; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .row > * { flex: 1 1 440px; min-width: 0; }
    .tile { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow-x: auto; }
    .tile h3 { font-size: 0.9rem; margin: 0; }
    .tile .tile-sub { color: var(--muted); font-size: 0.75rem; margin: 2px 0 8px; }

    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
    .kpi-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .kpi-value { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .kpi-sub   { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .table-wrap { max-height: 460px; overflow: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .data-table th { position: sticky; top: 0; background: var(--card); text-align: left; color: var(--muted); font-weight: 600;
                     padding: 5px 8px; border-bottom: 1px solid var(--border); }
    .data-table td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .data-table a { color: var(--link); text-decoration: none; }
    .data-table a:hover { text-decoration: underline; }
    .bar { display: flex; align-items: center; gap: 6px; min-width: 150px; }
    .bar .track { flex: 1; height: 0.7rem; background: var(--track); border-radius: 3px; overflow: hidden; }
    .bar .track > div { height: 100%; }
    .bar > span { font-size: 0.75rem; min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
    .tip { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
           padding: 6px 8px; font-size: 0.75rem; line-height: 1.4; }
    .tip strong { display: block; }
    @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div id="app"><h1>dbt Fusion issue health · Semiotic + MotherDuck live</h1><p class="status">Connecting…</p></div>

  <script type="module">
    // Tiles come from dashboard/tiles.yml; every chart reads a dbt dashboard
    // model in MotherDuck directly and renders it with Semiotic's React charts.
    // Interactions: hovering the backlog or response chart marks the same week in
    // the other (LinkedCharts x-position hover); legend clicks highlight a series.
    import {createElement as h, Fragment} from 'react';
    import {createRoot} from 'react-dom/client';
    import {MDConnection} from 'https://esm.sh/@motherduck/wasm-client@0.8.1';
    import {StackedAreaChart, GroupedBarChart, StackedBarChart, LineChart, LinkedCharts}
      from 'https://esm.sh/semiotic@3.11.0?external=react,react-dom';
    import yaml from 'https://esm.sh/js-yaml@4.1.0';

    const TOKEN = '__MOTHERDUCK_READ_TOKEN__';
    const root = createRoot(document.getElementById('app'));
    const T = model => `fusion_issues.main.${model}`;
    const toRows = result => JSON.parse(JSON.stringify(result.data.toRows(), (_, v) => typeof v === 'bigint' ? Number(v) : v));

    // Local-preview hook: a page can set window.__TILE_ROWS__ = async (model, orderBy) => rows.
    async function connect() {
      if (window.__TILE_ROWS__) return window.__TILE_ROWS__;
      if (!TOKEN || TOKEN.startsWith('__')) throw new Error('Token not injected — run deploy workflow.');
      const conn = MDConnection.create({mdToken: TOKEN});
      await conn.isInitialized();
      await conn.evaluateQuery("ATTACH IF NOT EXISTS 'md:fusion_issues' AS fusion_issues;");
      return async (model, orderBy) =>
        toRows(await conn.evaluateQuery(`SELECT * FROM ${T(model)}` + (orderBy ? ` ORDER BY ${orderBy}` : '')));
    }

    // ── Formatting helpers ──────────────────────────────────────────────────
    const num = v => v == null ? '—' : Number(v).toLocaleString('en-US', {maximumFractionDigits: 1});
    const isoDay = v => v instanceof Date || typeof v === 'number' ? new Date(v).toISOString().slice(0, 10) : String(v).slice(0, 10);
    const weekMs = v => Date.parse(isoDay(v));
    const shortDay = ms => new Date(ms).toLocaleDateString('en-US', {month: 'short', day: 'numeric', timeZone: 'UTC'});
    function fill(template, row) {  // bare column or "{col}" / "{col:+}" template; nulls -> "—"
      const t = String(template), tpl = t.includes('{') ? t : `{${t}}`;
      if ([...tpl.matchAll(/\{(\w+)(?::\+)?\}/g)].some(([, c]) => row[c] == null)) return '—';
      return tpl.replace(/\{(\w+)(:\+)?\}/g, (_, c, sign) => (sign && row[c] > 0 ? '+' : '') + num(row[c]));
    }
    const COLUMN_LABELS = {
      issue_number: '#', epic_number: '#', title: 'Title', issue_category: 'Type', areas: 'Areas',
      triage_status: 'Triage', reactions: 'Reactions', comments: 'Comments', age_days: 'Age (d)',
      days_idle: 'Idle (d)', is_customer_reported: 'Customer', child_closed: 'Closed',
      child_total: 'Sub-issues', pct_complete: '% complete', milestone_title: 'Milestone',
    };
    const NUMERIC = new Set(['reactions', 'comments', 'age_days', 'days_idle', 'child_closed', 'child_total', 'pct_complete']);

    async function setup() {
      const [contract, rowsFor] = await Promise.all([
        fetch('../tiles.yml').then(r => { if (!r.ok) throw new Error(`tiles.yml: ${r.status}`); return r.text(); }).then(yaml.load),
        connect(),
      ]);
      const tiles = new Map(contract.sections.flatMap(s => s.tiles.map(t => [t.id, t])));
      const rowsOf = model => rowsFor(model, [...tiles.values()].find(t => t.model === model)?.order_by);
      const models = ['dashboard_meta', ...tiles.keys()].map(id => tiles.get(id)?.model ?? id);
      const data = Object.fromEntries(await Promise.all(models.map(async m => [m, await rowsOf(m)])));
      root.render(h(Dashboard, {contract, tiles, data}));
    }

    function Dashboard({contract, tiles, data}) {
      // ── Palette ───────────────────────────────────────────────────────────
      const mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const keys = k => Object.keys(contract.palette[k]);
      const color = (k, n) => { const e = contract.palette[k][n]; return typeof e === 'string' ? e : e[mode]; };
      const label = (k, n) => contract.palette[k]?.[n]?.label ?? n;
      // Series are keyed by display label so legends read "Feature", not "feature".
      const scheme = k => Object.fromEntries(keys(k).map(n => [label(k, n), color(k, n)]));
      const SINGLE = contract.palette.single_series;
      const W = 460;

      // Rename the color column to its label and sort rows into palette stack order.
      const byPalette = (rows, k, col) => rows
        .map((d, i) => ({...d, series: label(k, d[col]), _i: i}))
        .sort((a, b) => keys(k).indexOf(a[col]) - keys(k).indexOf(b[col]) || a._i - b._i);

      const tip = (title, lines) => h('div', {className: 'tip'}, h('strong', null, title), ...lines.map(l => h('div', null, l)));
      const tileCard = (id, ...content) => {
        const t = tiles.get(id);
        return h('div', {className: 'tile'}, h('h3', null, t.title), h('p', {className: 'tile-sub'}, t.subtitle), ...content);
      };
      const question = id => h('h2', {className: 'question'}, contract.sections.find(s => s.id === id).question);
      const row = (...els) => h('div', {className: 'row'}, ...els);

      function table(id) {
        const t = tiles.get(id);
        const cell = (c, d) => {
          const v = d[c];
          const link = text => h('a', {href: d[t.link], target: '_blank', rel: 'noopener noreferrer'}, text);
          if (c === 'issue_number' || c === 'epic_number') return link(`#${v}`);
          if (c === 'title') return link(v);
          if (c === 'issue_category') return label('issue_category', v);
          if (typeof v === 'boolean') return v ? 'Yes' : '';
          if (c === 'pct_complete' && t.form === 'table_with_bar')
            return h('div', {className: 'bar'},
              h('div', {className: 'track'}, h('div', {style: {width: `${Number(v) || 0}%`, background: SINGLE}})),
              h('span', null, `${num(v)}%`));
          return NUMERIC.has(c) ? num(v) : v;
        };
        const cls = c => NUMERIC.has(c) ? 'num' : undefined;
        return tileCard(id, h('div', {className: 'table-wrap'}, h('table', {className: 'data-table'},
          h('thead', null, h('tr', null, t.columns.map(c => h('th', {key: c, className: cls(c)}, COLUMN_LABELS[c] ?? c)))),
          h('tbody', null, data[t.model].map((d, i) =>
            h('tr', {key: i}, t.columns.map(c => h('td', {key: c, className: cls(c)}, cell(c, d)))))))));
      }

      // Horizontal stacked bars by issue_category (or age_bucket); bar order is the model's order_by.
      function stacked(id) {
        const t = tiles.get(id);
        const rows = byPalette(data[t.model], t.color, t.color);
        const categories = new Set(data[t.model].map(d => d[t.y]));
        return tileCard(id, h(StackedBarChart, {
          data: rows, categoryAccessor: t.y, stackBy: 'series', valueAccessor: t.x, colorBy: 'series',
          colorScheme: scheme(t.color), orientation: 'horizontal', sort: false, valueLabel: 'Open issues',
          showLegend: true, legendPosition: 'top', legendInteraction: 'highlight', showGrid: true,
          width: W, height: Math.max(220, 34 * categories.size + 110), margin: {left: 150, top: 60},
        }));
      }

      // ── Header: freshness banner ──────────────────────────────────────────
      const m = data.dashboard_meta[0] ?? {};
      const k = data.headline_kpis[0] ?? {};
      const backlog = tiles.get('backlog_weekly');
      const flow = tiles.get('weekly_flow');
      const resp = tiles.get('response_weekly');
      const weekHover = {name: 'week', mode: 'x-position', xField: 'week_ms'};

      const flowRows = data.weekly_flow.flatMap(d => flow.series.map(s => ({
        week: isoDay(d.week), week_ms: weekMs(d.week), series: label('flow', s), value: d[s], net_change: d.net_change,
      })));

      return h(Fragment, null,
        h('header', null,
          h('h1', null, contract.title),
          h('p', {className: 'sub'}, `${contract.subtitle} · Semiotic + MotherDuck live`),
          h('p', {className: 'asof'}, 'Data as of ', h('strong', null, isoDay(m.as_of_date)), ` · ${m.source_repo} · label ${m.source_label}`),
          m.days_stale > contract.meta.stale_after_days &&
            h('p', {className: 'stale'}, `⚠ Data is ${m.days_stale} days old — the extract has probably stopped.`)),

        // ── Where do things stand? ─────────────────────────────────────────
        question('status'),
        h('div', {className: 'kpi-row'}, tiles.get('headline_kpis').kpis.map(x => h('div', {className: 'kpi-card', key: x.label},
          h('div', {className: 'kpi-label'}, x.label),
          h('div', {className: 'kpi-value'}, fill(x.value, k)),
          x.context && h('div', {className: 'kpi-sub'}, fill(x.context, k))))),

        h(LinkedCharts, {showLegend: false},
          // ── Is the backlog shrinking? ──────────────────────────────────────
          question('backlog'),
          h('p', {className: 'hint'}, 'Hover the backlog or 48-hour response chart to mark the same week in the other; click a legend entry to highlight a series.'),
          row(
            tileCard('backlog_weekly', h(StackedAreaChart, {
              data: byPalette(data.backlog_weekly, backlog.color, backlog.color).map(d => ({...d, week_ms: weekMs(d.week)})),
              xAccessor: 'week_ms', yAccessor: backlog.y, areaBy: 'series', colorBy: 'series',
              colorScheme: scheme(backlog.color), stackOrder: 'input', curve: 'linear', areaOpacity: 0.85,
              xFormat: shortDay, yLabel: 'Open issues', showGrid: true, showLegend: true, legendPosition: 'top',
              legendInteraction: 'highlight', linkedHover: weekHover, width: W, height: 280, margin: {top: 40},
              tooltip: d => tip(`${d.series} · week of ${shortDay(d.week_ms)}`, [`${num(d[backlog.y])} open`]),
            })),
            tileCard('weekly_flow', h(GroupedBarChart, {
              data: flowRows, categoryAccessor: 'week', groupBy: 'series', valueAccessor: 'value', colorBy: 'series',
              colorScheme: scheme('flow'), sort: false, valueLabel: 'Issues', showGrid: true,
              categoryFormat: w => shortDay(Date.parse(w)),
              showLegend: true, legendPosition: 'top', legendInteraction: 'highlight',
              width: W, height: 280, margin: {top: 40},
              tooltip: d => tip(`${d.series} · week of ${shortDay(d.week_ms)}`, [`${num(d.value)} issues`, `net change ${fill('{net_change:+}', d)}`]),
            })),
          ),

          // ── Are we keeping up with triage? ─────────────────────────────────
          question('triage'),
          row(
            stacked('triage_pipeline'),
            tileCard('response_weekly', h(LineChart, {
              data: data.response_weekly.map(d => ({...d, week_ms: weekMs(d.week)})),
              xAccessor: 'week_ms', yAccessor: resp.y, xScaleType: 'time', color: SINGLE, lineWidth: 2,
              showPoints: true, pointRadius: 2.5, yExtent: [0, 100], xFormat: shortDay,
              yLabel: '% answered within 48h', showGrid: true, linkedHover: weekHover, width: W, height: 280,
              tooltip: d => tip(`Week of ${shortDay(d.week_ms)}`, [
                `${num(d[resp.y])}% answered within 48h`,
                ...resp.tooltip.map(c => `${c.replaceAll('_', ' ')}: ${num(d[c])}`),
              ]),
            })),
          ),
        ),
        row(table('triage_queue')),

        // ── Where is the work? ───────────────────────────────────────────────
        question('where'),
        row(stacked('open_by_area'), stacked('open_by_adapter')),

        // ── How close are the epics? ─────────────────────────────────────────
        question('epics'),
        row(table('epic_progress')),

        // ── What should we work on, and who is on it? ────────────────────────
        question('next'),
        row(table('top_requested')),
        row(stacked('assignee_workload')),
        h('p', {className: 'status'}, 'Data loaded live from MotherDuck (Semiotic).'),
      );
    }

    setup().catch(err => {
      console.error(err);
      root.render(h(Fragment, null,
        h('h1', null, 'dbt Fusion issue health · Semiotic + MotherDuck live'),
        h('p', {className: 'status error'}, `Error: ${err.message}`)));
    });
  </script>
</body>
</html>
