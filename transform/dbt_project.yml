name: fusion_issue_analytics
version: '1.0.0'

profile: fusion_issue_analytics

flags:
  static_analysis: strict

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Staging stays as views; everything downstream is a table in every target so
# dashboards can read the database from any working directory (dev staging
# views resolve parquet paths relative to transform/).
models:
  fusion_issue_analytics:
    +materialized: view
    marts:
      +materialized: table
    metrics:
      +materialized: table
    dashboard:
      +materialized: table
