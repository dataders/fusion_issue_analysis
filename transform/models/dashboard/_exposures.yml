version: 2

# Every bakeoff framework renders the same tile set (dashboard/tiles.yml), so
# they share one exposure. tests/test_tiles_contract.py keeps this list, the
# manifest, and the models directory in sync.

exposures:
  - name: issue_health_bakeoff
    type: dashboard
    maturity: high
    url: https://dataders.github.io/fusion_issue_analysis/
    description: >
      dbt Fusion (engine:v2) issue health, rendered by every framework in the
      visualization bakeoff from the same tile models.
    depends_on:
      - ref('dashboard_meta')
      - ref('headline_kpis')
      - ref('backlog_weekly')
      - ref('weekly_flow')
      - ref('triage_pipeline')
      - ref('response_weekly')
      - ref('triage_queue')
      - ref('open_by_area')
      - ref('open_by_adapter')
      - ref('epic_progress')
      - ref('top_requested')
      - ref('assignee_workload')
    owner:
      name: dataders

  - name: duckdb_wasm_metricflow
    type: dashboard
    maturity: low
    description: DuckDB-WASM MetricFlow view (bakeoff)
    depends_on:
      - ref('metric_avg_time_to_close')
      - ref('metric_open_issue_count')
    owner:
      name: dataders
