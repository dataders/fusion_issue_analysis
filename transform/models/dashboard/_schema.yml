version: 2

# Tile models: one model per dashboard tile. The tile contract (question,
# chart form, encodings, palette) lives in dashboard/tiles.yml; every
# framework in the bakeoff renders these models and only these models.
# Time windows are anchored to as_of.as_of_date, never current_date.

models:
  - name: dashboard_meta
    description: One row — as-of date and staleness of the data behind every tile.
    columns:
      - name: as_of_date
        tests: [not_null]
      - name: days_stale
        description: Days between the latest issue activity and the build date. Warn when > 3.
        tests: [not_null]

  - name: headline_kpis
    description: One row of headline numbers. 28-day windows ending at as_of_date.
    columns:
      - name: open_issues
        tests: [not_null]
      - name: open_issues_28d_ago
      - name: opened_28d
      - name: closed_28d
      - name: backlog_change_28d
        description: opened_28d - closed_28d. Positive = the backlog grew.
      - name: awaiting_triage
      - name: awaiting_triage_median_age_days
      - name: pct_responded_48h_28d
        description: Share of issues opened in the window (and at least 48h old) that got a non-author reply within 48h. Unanswered = miss.
      - name: median_hours_to_first_response_28d
      - name: median_days_to_close_28d
      - name: open_hard_blockers
      - name: open_customer_reported

  - name: backlog_weekly
    description: Open non-epic issues at each week's end, by type. Long format, 52 weeks.
    columns:
      - name: week
        tests: [not_null]
      - name: issue_category
        tests:
          - accepted_values:
              arguments:
                values: ['bug', 'feature', 'task', 'other']
      - name: open_issues
        tests: [not_null]

  - name: weekly_flow
    description: Issues opened vs closed per complete week, last 26 weeks.
    columns:
      - name: week
        tests: [unique, not_null]
      - name: opened
      - name: closed
      - name: net_change
        description: opened - closed. Positive = backlog grew that week.

  - name: triage_pipeline
    description: Open non-epic issues by triage status x age bucket. Long format, every combination present.
    columns:
      - name: triage_status
        tests: [not_null]
      - name: status_label
      - name: status_order
      - name: age_bucket
      - name: age_bucket_order
      - name: issue_count
        tests: [not_null]

  - name: response_weekly
    description: Per creation week, share of new issues answered within 48h. Only weeks where every issue has had 48h.
    columns:
      - name: week
        tests: [unique, not_null]
      - name: issues_opened
      - name: responded_48h
      - name: pct_responded_48h
      - name: median_hours_to_first_response

  - name: triage_queue
    description: Open issues still awaiting triage, oldest first (top 50).
    columns:
      - name: issue_number
        tests: [unique, not_null]
      - name: title
      - name: issue_category
      - name: age_days
      - name: days_idle
      - name: reactions
      - name: comments
      - name: is_customer_reported
      - name: issue_url
        tests: [not_null]

  - name: open_by_area
    description: Open non-epic issues per area label, by type. Issues with several areas count in each.
    columns:
      - name: area
        tests: [not_null]
      - name: issue_category
      - name: issue_count
      - name: area_total

  - name: open_by_adapter
    description: Open non-epic issues per adapter label, by type. Issues with several adapters count in each.
    columns:
      - name: adapter
        tests: [not_null]
      - name: issue_category
      - name: issue_count
      - name: adapter_total

  - name: epic_progress
    description: Open epics with sub-issues, most complete first.
    columns:
      - name: epic_number
        tests: [unique, not_null]
      - name: title
      - name: issue_url
      - name: child_total
      - name: child_closed
      - name: child_open
      - name: pct_complete
      - name: milestone_title

  - name: top_requested
    description: Open non-epic issues ranked by reactions then comments (top 25).
    columns:
      - name: issue_number
        tests: [unique, not_null]
      - name: title
      - name: issue_category
      - name: age_days
      - name: days_idle
      - name: reactions
      - name: comments
      - name: is_customer_reported
      - name: issue_url
        tests: [not_null]
      - name: triage_status
      - name: is_hard_blocker
      - name: areas

  - name: assignee_workload
    description: Top 15 assignees (incl. '(unassigned)') by open non-epic issues, by type. Long format.
    columns:
      - name: assignee_login
        tests: [not_null]
      - name: issue_category
      - name: issue_count
      - name: assignee_total

  # MetricFlow-shaped models consumed by the duckdb-wasm MetricFlow view.
  - name: metric_avg_time_to_close
    description: Weekly time-to-close by issue_category (MetricFlow avg_time_to_close shape).
  - name: metric_open_issue_count
    description: Open issue count by issue_category and milestone (MetricFlow open_issue_count shape).
