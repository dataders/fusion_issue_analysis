# dft render opens DuckDB read-only and forces enable_external_access=False,
# so it cannot follow the dev views that read raw parquet. We therefore point
# at a fully-materialized serving DB (all marts as base tables, no external
# file reads). Rebuild it with: scripts/build_dataface_db.sh
sources:
  default: fusion_issues
  fusion_issues:
    type: duckdb
    path: ../data/serve/fusion_issues.duckdb
