title: "dbt v2 issue health"
description: >
  Open engine:v2 issues in dbt-labs/dbt-core (epics excluded unless noted).
  Renders the tile contract in dashboard/tiles.yml, one thin query per dbt
  dashboard model (transform/models/dashboard/).

source: fusion_issues

# Keep authored casing: title case turns "v2" into "V2" and doesn't match the
# sentence-case headings every other framework in the bakeoff uses.
style:
  title: { font: { case: none } }
  charts:
    kpi: { label: { font: { case: none } } }
    table: { header: { font: { case: none } } }

queries:
  # dbt owns all metric logic. Each query is a direct model read ordered by
  # the tile's tiles.yml `order_by`, against the snapshot built by
  # scripts/snapshot_dashboard_db.py (every dashboard model).
  dashboard_meta:
    description: One row — as-of date and staleness of the data.
    sql: select * from fusion_issues.main.dashboard_meta
  headline_kpis:
    description: One row of headline numbers (28-day windows).
    sql: select * from fusion_issues.main.headline_kpis
  backlog_weekly:
    description: Open non-epic issues at each week's end, by type (long).
    sql: select * from fusion_issues.main.backlog_weekly order by week
  weekly_flow:
    description: Issues opened vs closed per complete week.
    sql: select * from fusion_issues.main.weekly_flow order by week
  triage_pipeline:
    description: Open issues by triage status x age bucket (long).
    sql: select * from fusion_issues.main.triage_pipeline order by status_order, age_bucket_order
  response_weekly:
    description: Share of new issues answered within 48h, by week opened.
    sql: select * from fusion_issues.main.response_weekly order by week
  triage_queue:
    description: Open issues still awaiting triage, oldest first.
    sql: select * from fusion_issues.main.triage_queue order by age_days desc
  open_by_area:
    description: Open issues per area label, by type (long).
    sql: select * from fusion_issues.main.open_by_area order by area_total desc, area
  open_by_adapter:
    description: Open issues per adapter label, by type (long).
    sql: select * from fusion_issues.main.open_by_adapter order by adapter_total desc, adapter
  epic_progress:
    description: Open epics with sub-issues, most complete first.
    sql: select * from fusion_issues.main.epic_progress order by pct_complete desc, child_open, epic_number
  top_requested:
    description: Open issues ranked by reactions, then comments.
    sql: select * from fusion_issues.main.top_requested order by reactions desc, comments desc
  assignee_workload:
    description: Top 15 assignees by open issues, by type (long).
    sql: select * from fusion_issues.main.assignee_workload order by assignee_total desc, assignee_login

charts:
  # ---- Header: freshness ----
  data_as_of_kpi:
    description: As-of date; days_stale turns red when > 3 (tiles.yml stale_after_days) — the extract has probably stopped.
    query: dashboard_meta
    type: kpi
    variant: inline
    value: as_of_date
    label: "Data as of"
    support:
      value: days_stale
      format: "d"
      label: "days since latest activity (warning when > 3)"
    conditional_formatting:
      days_stale:
        when:
          - gt: 3
            background: negative.bg
            font: { color: negative.text, weight: "700" }
            glyph: "⚠"
            glyph_color: negative.solid

  # ---- Where do things stand? ----
  kpi_open_issues:
    query: headline_kpis
    type: kpi
    value: open_issues
    label: "Open issues"
    style: { value: { format: integer } }
    support:
      value: backlog_change_28d
      format: "+d"
      label: "in 28 days"

  kpi_opened_closed:
    query: headline_kpis
    type: kpi
    value: opened_28d
    label: "Opened / closed (28d)"
    style: { value: { format: { spec: "d", suffix: " opened" } } }
    support:
      value: closed_28d
      format: "d"
      label: "closed"

  kpi_awaiting_triage:
    query: headline_kpis
    type: kpi
    value: awaiting_triage
    label: "Awaiting triage"
    style: { value: { format: integer } }
    support:
      value: awaiting_triage_median_age_days
      format: ".0f"
      label: "days median age"

  kpi_answered_48h:
    query: headline_kpis
    type: kpi
    value: pct_responded_48h_28d
    label: "Answered within 48h (28d)"
    style: { value: { format: { spec: ".0f", suffix: "%" } } }
    support:
      value: median_hours_to_first_response_28d
      format: ",.1~f"
      label: "h median first reply"

  kpi_median_close:
    query: headline_kpis
    type: kpi
    value: median_days_to_close_28d
    label: "Median days to close (28d)"
    style: { value: { format: ",.1~f" } }

  kpi_customer_reported:
    query: headline_kpis
    type: kpi
    value: open_customer_reported
    label: "Customer-reported open"
    style: { value: { format: integer } }
    support:
      value: open_hard_blockers
      format: "d"
      label: "hard blockers"

  # ---- Is the backlog shrinking? ----
  backlog_weekly_chart:
    query: backlog_weekly
    type: area
    title: "Open issues over time"
    subtitle: "Open at the end of each week, by type"
    x: week
    y: open_issues
    color: issue_category
    x_label: "Week"
    y_label: "Open issues"
    style:
      stack: zero
      color:
        categorical:
          palette: &issue_category_palette ["#eb6834", "#2a78d6", "#898781", "#1baf7a"]
      endpoint_labels: { visible: true }

  weekly_flow_chart:
    query: weekly_flow
    type: bar
    title: "Opened vs closed per week"
    subtitle: "Complete weeks; when closed > opened the backlog shrank"
    x: week
    y: [opened, closed]
    x_label: "Week"
    y_label: "Issues"
    style:
      orientation: vertical
      stack: none
      color:
        categorical:
          # stops follow the alphabetical domain: closed, opened
          palette: ["#2a78d6", "#eb6834"]

  # ---- Are we keeping up with triage? ----
  triage_pipeline_chart:
    query: triage_pipeline
    type: bar
    title: "Open issues by triage status and age"
    subtitle: "How much is waiting, and for how long"
    x: status_label
    y: issue_count
    color: age_bucket
    sort: { by: status_order, order: asc }
    y_label: "Open issues"
    style:
      orientation: horizontal
      stack: zero
      stack_order: data
      color:
        categorical:
          # stops follow the alphabetical domain: 0-7d, 180d+, 31-90d, 8-30d, 91-180d
          palette: ["#b7d3f6", "#104281", "#5598e7", "#86b6ef", "#256abf"]
      endpoint_labels: { visible: false }
      legend:
        position: top
        values: ["0-7d", "8-30d", "31-90d", "91-180d", "180d+"]

  response_weekly_chart:
    query: response_weekly
    type: line
    title: "New issues answered within 48 hours"
    subtitle: "By week opened; unanswered issues count as misses"
    x: week
    y: pct_responded_48h
    x_label: "Week opened"
    y_label: "% answered within 48h"
    style:
      color:
        static: "#2a78d6"

  triage_queue_table:
    query: triage_queue
    type: table
    title: "Triage queue — oldest first"
    subtitle: "Open issues still labeled status:triage"
    style:
      columns:
        issue_number: { label: "#", format: "d", link: "{{ issue_url }}" }
        title: { label: "Title", link: "{{ issue_url }}" }
        issue_category: { label: "Type" }
        age_days: { label: "Age (days)", format: integer }
        days_idle: { label: "Idle (days)", format: integer }
        reactions: { label: "Reactions", format: integer }
        comments: { label: "Comments", format: integer }
        is_customer_reported: { label: "Customer" }

  # ---- Where is the work? ----
  open_by_area_chart:
    query: open_by_area
    type: bar
    title: "Open issues by area"
    subtitle: "Issues with several areas count in each"
    x: area
    y: issue_count
    color: issue_category
    sort: { by: area_total, order: desc }
    y_label: "Open issues"
    style:
      orientation: horizontal
      stack: zero
      stack_order: alphabetical
      color:
        categorical:
          palette: *issue_category_palette
      endpoint_labels: { visible: false }
      legend: { position: top, values: [feature, bug, task, other] }

  open_by_adapter_chart:
    query: open_by_adapter
    type: bar
    title: "Open issues by adapter"
    subtitle: "(none) = adapter-agnostic"
    x: adapter
    y: issue_count
    color: issue_category
    sort: { by: adapter_total, order: desc }
    y_label: "Open issues"
    style:
      orientation: horizontal
      stack: zero
      stack_order: alphabetical
      color:
        categorical:
          palette: *issue_category_palette
      endpoint_labels: { visible: false }
      legend: { position: top, values: [feature, bug, task, other] }

  # ---- How close are the epics? ----
  epic_progress_table:
    query: epic_progress
    type: table
    title: "Open epics by % of sub-issues closed"
    subtitle: "Top of the list can be closed out soon"
    style:
      columns:
        epic_number: { label: "#", format: "d", link: "{{ issue_url }}" }
        title: { label: "Epic", link: "{{ issue_url }}" }
        child_closed: { label: "Closed", format: integer }
        child_total: { label: "Sub-issues", format: integer }
        pct_complete:
          label: "% complete"
          format: { spec: ".0f", suffix: "%" }
          scale:
            background:
              palette: ["#ffffff", "#2a78d6"]
              min: 0
              max: 100
        milestone_title: { label: "Milestone" }

  # ---- What should we work on, and who is on it? ----
  top_requested_table:
    query: top_requested
    type: table
    title: "Most-requested open issues"
    subtitle: "Ranked by reactions, then comments"
    style:
      columns:
        issue_number: { label: "#", format: "d", link: "{{ issue_url }}" }
        title: { label: "Title", link: "{{ issue_url }}" }
        issue_category: { label: "Type" }
        areas: { label: "Areas" }
        triage_status: { label: "Triage" }
        reactions: { label: "Reactions", format: integer }
        comments: { label: "Comments", format: integer }
        age_days: { label: "Age (days)", format: integer }
        is_customer_reported: { label: "Customer" }

  assignee_workload_chart:
    query: assignee_workload
    type: bar
    title: "Open issues by assignee"
    subtitle: "Top 15, including unassigned"
    x: assignee_login
    y: issue_count
    color: issue_category
    sort: { by: assignee_total, order: desc }
    y_label: "Open issues"
    style:
      orientation: horizontal
      stack: zero
      stack_order: alphabetical
      color:
        categorical:
          palette: *issue_category_palette
      endpoint_labels: { visible: false }
      legend: { position: top, values: [feature, bug, task, other] }

rows:
  - data_as_of_kpi

  - title: "Where do things stand?"
    rows:
      - cols:
          - kpi_open_issues
          - kpi_opened_closed
          - kpi_awaiting_triage
      - cols:
          - kpi_answered_48h
          - kpi_median_close
          - kpi_customer_reported

  - title: "Is the backlog shrinking?"
    cols:
      - backlog_weekly_chart
      - weekly_flow_chart

  - title: "Are we keeping up with triage?"
    rows:
      - cols:
          - triage_pipeline_chart
          - response_weekly_chart
      - triage_queue_table

  - title: "Where is the work?"
    cols:
      - open_by_area_chart
      - open_by_adapter_chart

  - title: "How close are the epics?"
    rows:
      - epic_progress_table

  - title: "What should we work on, and who is on it?"
    rows:
      - top_requested_table
      - assignee_workload_chart
