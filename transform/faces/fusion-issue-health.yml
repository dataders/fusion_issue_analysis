title: "dbt-fusion Issue Health"
description: >
  CORE-22 canonical dashboard for the dbt-fusion GitHub repository.
  Queries dbt dashboard models directly: summary_kpis, issue_triage_health,
  triage_health, cumulative_flow, velocity, response_pctiles, age_distribution,
  close_by_label, assignee_workload, community_priorities, oldest_untriaged.

source: fusion_issues

queries:
  # --- Operational Triage KPIs ---
  triage_health_kpis:
    description: Single-row operational triage counts from issue_triage_health.
    sql: >
      SELECT
        slipped_through_count,
        triage_queue_count,
        hard_blocker_count,
        hard_blocker_unreleased,
        stale_count AS triage_stale_count,
        needs_repro_count,
        repro_verified_count,
        total_open
      FROM fusion_issues.main.issue_triage_health

  # --- Oldest Untriaged Bugs table ---
  oldest_untriaged:
    description: Top untriaged bugs ordered by age; issue_url used for hyperlinks.
    sql: >
      SELECT
        issue_number,
        title,
        age_days,
        issue_url
      FROM fusion_issues.main.oldest_untriaged
      ORDER BY age_days DESC

  # --- Key Metrics KPIs ---
  summary_kpis:
    description: Single-row summary KPIs including the new net_flow_4w column.
    sql: >
      SELECT
        open_issues,
        net_flow_4w,
        rolling_median_close_days,
        pct_responded_48h,
        stale_count AS summary_stale_count
      FROM fusion_issues.main.summary_kpis

  # --- Trends ---
  cumulative_flow:
    description: Weekly cumulative opened and closed issue counts for area chart.
    sql: >
      SELECT
        week,
        cumulative_opened,
        cumulative_closed
      FROM fusion_issues.main.cumulative_flow
      ORDER BY week

  velocity:
    description: Median days to close by week and issue_category (bug vs enhancement).
    sql: >
      SELECT
        week,
        issue_category,
        median_days
      FROM fusion_issues.main.velocity
      ORDER BY week, issue_category

  response_pctiles:
    description: >
      Weekly time-to-first-response percentiles (p25/p50/p75) in hours,
      unpivoted to long format so each percentile is a distinct, legended series.
    sql: >
      SELECT week, percentile, hours
      FROM (
        SELECT week, p25, p50, p75
        FROM fusion_issues.main.response_pctiles
      )
      UNPIVOT (hours FOR percentile IN (p25, p50, p75))
      ORDER BY week, percentile

  age_distribution:
    description: >
      Issue count by age bucket and category. Ordered by bucket_sort_order
      so bars appear chronologically; all categories (bug, enhancement, task,
      other) are included dynamically — no hardcoded list.
    sql: >
      SELECT
        age_bucket,
        bucket_sort_order,
        issue_category,
        issue_count
      FROM fusion_issues.main.age_distribution
      ORDER BY bucket_sort_order, issue_category

  close_by_label:
    description: Median days to close grouped by issue label.
    sql: >
      SELECT
        label_name,
        median_days_to_close,
        closed_count
      FROM fusion_issues.main.close_by_label
      ORDER BY median_days_to_close DESC

  # --- Triage Health KPIs ---
  label_health_kpis:
    description: Single-row triage-process quality percentages.
    sql: >
      SELECT
        pct_labeled,
        pct_typed,
        pct_assigned,
        pct_milestoned
      FROM fusion_issues.main.triage_health

  # --- People ---
  assignee_workload:
    description: Open issues per assignee broken down into bugs and enhancements.
    sql: >
      SELECT
        assignee_login,
        bugs,
        enhancements
      FROM fusion_issues.main.assignee_workload
      ORDER BY bugs + enhancements DESC

  community_priorities:
    description: Community-voted high-priority issues; issue_url used for links.
    sql: >
      SELECT
        issue_number,
        title,
        issue_category,
        reactions_total_count,
        comments_total_count,
        age_days,
        issue_url
      FROM fusion_issues.main.community_priorities
      ORDER BY reactions_total_count DESC

charts:
  # ---- Operational Triage ----
  slipped_through_kpi:
    description: Count of bugs that slipped through without being triaged before first response.
    query: triage_health_kpis
    type: kpi
    value: slipped_through_count
    label: "Slipped Through (bugs)"

  triage_queue_kpi:
    description: Number of issues currently in the triage queue.
    query: triage_health_kpis
    type: kpi
    value: triage_queue_count
    label: "Triage Queue"
    style:
      value:
        format: integer

  hard_blockers_kpi:
    description: Count of hard-blocker issues; subtext shows unreleased hard blockers.
    query: triage_health_kpis
    type: kpi
    value: hard_blocker_count
    label: "Hard Blockers"
    support:
      value: hard_blocker_unreleased
      label: "unreleased"

  triage_stale_kpi:
    description: Issues with no activity in 90+ days.
    query: triage_health_kpis
    type: kpi
    value: triage_stale_count
    label: "Stale (90d+)"

  needs_repro_kpi:
    description: Bugs that need a reproduction case.
    query: triage_health_kpis
    type: kpi
    value: needs_repro_count
    label: "Needs Repro"
    style:
      value:
        format: integer

  repro_verified_kpi:
    description: Bugs with a verified reproduction case.
    query: triage_health_kpis
    type: kpi
    value: repro_verified_count
    label: "Repro Verified"

  total_open_kpi:
    description: Total open issues (optional tile retained from original).
    query: triage_health_kpis
    type: kpi
    value: total_open
    label: "Total Open"
    style:
      value:
        format: integer

  oldest_untriaged_table:
    description: Oldest untriaged bugs with clickable links via issue_url.
    query: oldest_untriaged
    type: table
    link: issue_url
    style:
      columns:
        issue_number:
          label: "#"
        title:
          label: "Title"
        age_days:
          label: "Age (days)"

  # ---- Key Metrics ----
  open_issues_kpi:
    description: Current total count of open issues.
    query: summary_kpis
    type: kpi
    value: open_issues
    label: "Open Issues"
    style:
      value:
        format: integer

  net_flow_kpi:
    description: Net flow over last 4 weeks (closed - opened). Positive = backlog shrinking.
    query: summary_kpis
    type: kpi
    value: net_flow_4w
    label: "Net Flow (4 wk)"

  median_close_kpi:
    description: Rolling 4-week median days to close an issue.
    query: summary_kpis
    type: kpi
    value: rolling_median_close_days
    label: "Median Close (4 wk)"

  response_sla_kpi:
    description: Percentage of issues receiving a response within 48 hours.
    query: summary_kpis
    type: kpi
    value: pct_responded_48h
    label: "48h Response SLA"

  summary_stale_kpi:
    description: Issues with no activity in 30+ days.
    query: summary_kpis
    type: kpi
    value: summary_stale_count
    label: "Stale Issues (30d+)"
    style:
      value:
        format: integer

  # ---- Trends ----
  cumulative_flow_chart:
    description: Cumulative opened vs closed issue counts over time (area chart).
    query: cumulative_flow
    type: area
    x: week
    y:
      - cumulative_opened
      - cumulative_closed
    title: "Cumulative Issue Flow"

  velocity_chart:
    description: Median days to close for bugs vs enhancements each week.
    query: velocity
    type: line
    x: week
    y: median_days
    color: issue_category
    title: "Median Days to Close: Bugs vs Enhancements"

  response_pctiles_chart:
    description: Time to first response at p25/p50/p75 each week.
    query: response_pctiles
    type: line
    x: week
    y: hours
    color: percentile
    title: "Time to First Response (hours)"

  age_distribution_chart:
    description: >
      Stacked bar of open issues by age bucket and category.
      Ordered by bucket_sort_order from the model — no hardcoded bucket list.
    query: age_distribution
    type: bar
    x: age_bucket
    y: issue_count
    color: issue_category
    sort:
      by: bucket_sort_order
      order: asc
    title: "Open Issue Age by Type"
    style:
      stack: zero

  close_by_label_chart:
    description: Median days to close broken out by issue label.
    query: close_by_label
    type: bar
    x: label_name
    y: median_days_to_close
    sort:
      by: median_days_to_close
      order: desc
    title: "Median Days to Close by Label"

  # ---- Triage Health ----
  pct_labeled_kpi:
    description: Percentage of open issues that have at least one label.
    query: label_health_kpis
    type: kpi
    value: pct_labeled
    label: "% Labeled"

  pct_typed_kpi:
    description: Percentage of open issues classified as bug/enhancement/task.
    query: label_health_kpis
    type: kpi
    value: pct_typed
    label: "% Typed"

  pct_assigned_kpi:
    description: Percentage of open issues with an assignee.
    query: label_health_kpis
    type: kpi
    value: pct_assigned
    label: "% Assigned"

  pct_milestoned_kpi:
    description: Percentage of open issues linked to a milestone.
    query: label_health_kpis
    type: kpi
    value: pct_milestoned
    label: "% Milestoned"

  # ---- People ----
  assignee_workload_chart:
    description: Open bugs and enhancements per assignee, stacked.
    query: assignee_workload
    type: bar
    x: assignee_login
    y:
      - bugs
      - enhancements
    title: "Open Issues by Assignee"
    style:
      stack: zero

  community_priorities_table:
    description: Top community-priority issues with reaction counts and links via issue_url.
    query: community_priorities
    type: table
    link: issue_url
    style:
      columns:
        issue_number:
          label: "#"
        title:
          label: "Title"
        issue_category:
          label: "Type"
        reactions_total_count:
          label: "Reactions"
        comments_total_count:
          label: "Comments"
        age_days:
          label: "Age (days)"

rows:
  - title: "Operational Triage"
    description: Bug triage queue health and actionable counts.
    cols:
      - slipped_through_kpi
      - triage_queue_kpi
      - hard_blockers_kpi
      - triage_stale_kpi
      - needs_repro_kpi
      - repro_verified_kpi
      - total_open_kpi

  - oldest_untriaged_table

  - title: "Key Metrics"
    description: Summary KPIs for the overall issue backlog.
    cols:
      - open_issues_kpi
      - net_flow_kpi
      - median_close_kpi
      - response_sla_kpi
      - summary_stale_kpi

  - title: "Trends"
    description: Week-over-week issue flow, velocity, and response-time trends.
    rows:
      - cols:
          - cumulative_flow_chart
          - velocity_chart
      - cols:
          - response_pctiles_chart
          - age_distribution_chart
      - close_by_label_chart

  - title: "Triage Health"
    description: Process-quality percentages measuring labeling and assignment completeness.
    cols:
      - pct_labeled_kpi
      - pct_typed_kpi
      - pct_assigned_kpi
      - pct_milestoned_kpi

  - title: "People"
    description: Workload distribution and community-driven priorities.
    rows:
      - assignee_workload_chart
      - community_priorities_table
