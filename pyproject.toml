[project]
name = "fusion-issue-analysis"
version = "0.1.0"
description = "Analytics pipeline and dashboard bakeoff for dbt Fusion (engine:v2) GitHub issues"
requires-python = ">=3.12"
dependencies = [
    "dbt-charts==0.10.0",
    "dbt-duckdb>=1.10.1",
    "dlt[filesystem,parquet]>=1.24.0",
    "duckdb==1.5.6",
    "marimo>=0.25.2",
    "markdown>=3.10.2",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=7.1.0",
    "fastmcp>=4.1.0",
    "prefab-ui>=0.21.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { fastmcp = false, fastmcp-slim = false, prefab-ui = false }

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "extract/tests"]
norecursedirs = ["tests/ui"]

[tool.ruff]
line-length = 120
extend-exclude = ["dashboard/evidence", "dashboard/observable", "dashboard/mcp-app"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
# B008: dlt requires incremental() in defaults; SIM108/SIM117: readability.
ignore = ["B008", "SIM108", "SIM117"]
